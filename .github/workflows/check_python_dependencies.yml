name: Check Python Dependencies

on:
  pull_request:
  merge_group:

jobs:
  check_dependencies:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and setuptools
        run: python -m pip install --upgrade pip setuptools

      - name: Install repo-tools
        run: |
          python -m pip install edx-repo-tools[find_dependencies]
          python -m pip install --upgrade 'requirements-parser>=0.13.0'

      - name: Run Python script
        run: |
          find_python_dependencies \
            --req-file requirements/edx/base.txt \
            --req-file requirements/edx/testing.txt \
            --ignore https://github.com/mitodl/edx-sga \
            --ignore https://github.com/open-craft/xblock-poll
