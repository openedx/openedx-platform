name: Javascript tests

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

jobs:
  run_tests:
    name: JS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [20]
        python-version:
          - "3.12"

    steps:
      - uses: actions/checkout@v7
      - name: Fetch master to compare coverage
        run: git fetch --depth=1 origin master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup npm
        run: npm i -g npm@10.7.x

      - name: Install Firefox 123.0
        run: |
          sudo apt-get purge firefox
          wget "https://ftp.mozilla.org/pub/firefox/releases/123.0/linux-x86_64/en-US/firefox-123.0.tar.bz2"
          tar -xjf firefox-123.0.tar.bz2
          sudo mv firefox /opt/firefox
          sudo ln -s /opt/firefox/firefox /usr/bin/firefox

      - name: Install Required System Packages
        run: sudo apt-get update && sudo apt-get install libxmlsec1-dev ubuntu-restricted-extras xvfb

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Required Python Dependencies
        run: make base-requirements

      - name: Install npm
        run: npm ci  

      - name: Run JS Tests
        run: |
          npm run test

      - name: Save Job Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Build-Artifacts
          path: |
            reports/**/*
            test_root/log/*.png
            test_root/log/*.log
            **/TEST-*.xml
          overwrite: true
