name: static assets check for lms and cms

on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

jobs:
  static_assets_check:
    name: static-assets-check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        python-version:
          - "3.12"
        node-version: [20]
        npm-version: [10.7.x]
        mongo-version:
          - "7.0"

    services:
      mongo:
        image: mongo:${{ matrix.mongo-version }}
        ports:
          - 27017:27017
        # Note: Calling mongo here only works with mongo 4, in newer versions of mongo
        # we'll have to use `mongosh`, hence the 'which mongosh mongo'.
        options: >-
          --health-cmd "$(which mongosh mongo) --quiet --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install system Packages
        run: |
          sudo apt-get update
          sudo apt-get install libxmlsec1-dev pkg-config

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup npm
        run: npm i -g npm@${{ matrix.npm-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Python Deps for Build and Collection
        run: uv sync --no-default-groups --group bundled --group assets --frozen

      - name: Add node_modules bin to $Path
        run: echo $GITHUB_WORKSPACE/node_modules/.bin >> $GITHUB_PATH

      - name: Check Dev Assets Build
        env:
          COMPREHENSIVE_THEMES_DIR: ./themes
        run: |
          npm clean-install --dev
          npm run build-dev

      - name: Check Prod Assets Build
        env:
          COMPREHENSIVE_THEMES_DIR: ./themes
        run: |
          npm clean-install
          npm run build

      - name: Check Assets Collection
        env:
          LMS_CFG: lms/envs/minimal.yml
          CMS_CFG: lms/envs/minimal.yml
        run: |
          DJANGO_SETTINGS_MODULE=lms.envs.production uv run ./manage.py lms collectstatic --noinput
          DJANGO_SETTINGS_MODULE=cms.envs.production uv run ./manage.py cms collectstatic --noinput
