# Python and Node.js versions are kept in sync automatically from
# pyproject.toml and .nvmrc by the
# "Update publiccode.yml" workflow. softwareVersion and releaseDate follow the
# latest release/* git tag. The services below are the defaults installed by
# Tutor (https://github.com/overhangio/tutor) and are maintained by hand.
dependsOn:
  open:
    - name: Python
      version: "3.12"
    - name: Node.js
      version: "24"
    - name: MySQL
      version: "8.4"
    - name: MongoDB
      version: "7.0"
    - name: Redis
      version: "7.4"
    - name: Meilisearch
      version: "1.36"
    - name: Caddy
      version: "2.11"
    - name: Exim (SMTP relay)
      version: "4.96"
