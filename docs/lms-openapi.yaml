    CourseRunOverview:
      type: object
      description: Serializer for a course run overview.
      properties:
        course_run_id:
          type: string
          description: ID for the course run.
        display_name:
          type: string
          description: Display name of the course run.
        resume_course_run_url:
          type: string
          description: The absolute url that takes the user back to their position
            in the course run; if absent, user has not made progress in the course.
        course_run_url:
          type: string
          description: The absolute url for the course run.
        start_date:
          type: string
          format: date-time
          description: Start date for the course run; null if no start date.
        end_date:
          type: string
          format: date-time
          description: End date for the course run; null if no end date.
        course_run_status:
          allOf:
          - $ref: '#/components/schemas/CourseRunStatusEnum'
          description: |-
            The user's status of the course run.

            * `in_progress` - in_progress
            * `upcoming` - upcoming
            * `completed` - completed
        emails_enabled:
          type: boolean
          description: Boolean representing whether emails are enabled for the course;if
            absent, the bulk email feature is either not enable at the platformlevel
            or is not enabled for the course; if True or False, bulk emailfeature
            is enabled, and value represents whether or not user wantsto receive emails.
        due_dates:
          type: array
          items:
            $ref: '#/components/schemas/DueDate'
          description: List of subsection due dates for the course run. Due dates
            are only returned if the course run is in progress.
        micromasters_title:
          type: string
          description: Title of the MicroMasters program that the course run is a
            part of; if absent, the course run is not a part of a MicroMasters program.
        certificate_download_url:
          type: string
          description: URL to download a certificate, if available; if absent, certificate
            is not downloadable.
      required:
      - course_run_id
      - course_run_status
      - course_run_url
      - display_name
      - due_dates
      - end_date
      - start_date
    CourseRunOverviewList:
      type: object
      description: Serializer for a list of course run overviews.
      properties:
        course_runs:
          type: array
          items:
