openapi: 3.0.3
info:
  title: Open edX API
  version: v1
  description: APIs for access to Open edX information
paths:
  /admin/enterprise/enterprisecatalogquery/{var}/preview/:
    get:
      operationId: admin_enterprise_enterprisecatalogquery_preview_retrieve
      description: Render the response for a particular catalog query.
      parameters:
      - in: path
        name: var
        schema:
          type: string
        required: true
      tags:
      - admin
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api-admin/api/v1/api_access_request/:
    get:
      operationId: api_admin_api_v1_api_access_request_list
      description: |-
        Return `API Access Requests` in the form of a paginated list.

        Raises:
            NotFound: Raised if user with `username` provided in `GET` parameters does not exist.
            PermissionDenied: Raised if `username` is provided in `GET` parameters but the requesting
                user does not have access rights to filter results.

        Example:
            `GET: /api-admin/api/v1/api_access_request/`
            {
                "count": 1,
                "num_pages": 1,
                "current_page": 1,
                "results": [
                    {
                        "id": 1,
                        "created": "2017-09-25T08:41:48.934364Z",
                        "modified": "2017-09-25T08:42:04.185209Z",
                        "user": 6,
                        "status": "denied",
                        "website": "https://www.example.com/",
                        "reason": "Example",
                        "company_name": "Example Name",
                        "company_address": "Silicon Valley",
                        "site": 1,
                        "contacted": true
                    }
                ],
                "next": null,
                "start": 0,
                "previous": null
            }
      parameters:
      - in: query
        name: company_name
        schema:
          type: string
      - in: query
        name: contacted
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: site__domain
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - denied
          - pending
        description: |-
          Status of this API access request

          * `pending` - Pending
          * `denied` - Denied
          * `approved` - Approved
      - in: query
        name: user__username
        schema:
          type: string
      tags:
      - api-admin
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiAccessRequestList'
          description: ''
  /api/agreements/v1/agreement/:
    get:
      operationId: api_agreements_v1_agreement_list
      description: Get all user agreements for this agreement type.
      parameters:
      - in: query
        name: agreement_type
        schema:
          type: array
          items:
            type: string
        description: Agreement ID/Type
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAgreementList'
          description: ''
        '400':
          description: Bad Request
  /api/agreements/v1/agreement/{agreement_type}/:
    get:
      operationId: api_agreements_v1_agreement_retrieve
      description: Get the user agreement for this agreement type.
      parameters:
      - in: path
        name: agreement_type
        schema:
          type: string
        description: Agreement ID/Type
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgreement'
          description: ''
        '400':
          description: Bad Request
        '404':
          description: Not Found
  /api/agreements/v1/agreement/{agreement_type}/text/:
    get:
      operationId: api_agreements_v1_agreement_text_retrieve
      description: Get the text of a user agreement by its type.
      parameters:
      - in: path
        name: agreement_type
        schema:
          type: string
        description: Agreement ID/Type
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgreement'
          description: ''
        '400':
          description: Bad Request
        '404':
          description: Not Found
  /api/agreements/v1/agreement_record/{agreement_type}:
    get:
      operationId: api_agreements_v1_agreement_record_retrieve
      description: Get a user's acknowledgement record for this agreement type.
      parameters:
      - in: path
        name: agreement_type
        schema:
          type: string
        description: Agreement ID/Type
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgreementRecord'
          description: ''
        '400':
          description: Bad Request
        '404':
          description: Not Found
    post:
      operationId: api_agreements_v1_agreement_record_create
      description: Marks a user's acknowledgement of this agreement type.
      parameters:
      - in: path
        name: agreement_type
        schema:
          type: string
        description: Agreement ID/Type
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAgreementRecord'
          description: ''
        '400':
          description: Bad Request
  /api/agreements/v1/integrity_signature/{course_id}:
    get:
      operationId: api_agreements_v1_integrity_signature_retrieve
      description: |-
        In order to check whether the user has signed the integrity agreement for a given course.

        Should return the following:
            username (str)
            course_id (str)
            created_at (str)

        If a username is not given, it should default to the requesting user (or masqueraded user).
        Only staff should be able to access this endpoint for other users.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
    post:
      operationId: api_agreements_v1_integrity_signature_create
      description: |-
        Create an integrity signature for the requesting user and course. If a signature
        already exists, returns the existing signature instead of creating a new one.

        /api/agreements/v1/integrity_signature/{course_id}

        Example response:
            {
                username: "janedoe",
                course_id: "org.2/course_2/Run_2",
                created_at: "2021-04-23T18:25:43.511Z"
            }
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/agreements/v1/lti_pii_signature/{course_id}:
    post:
      operationId: api_agreements_v1_lti_pii_signature_create
      description: |-
        Create an LTI PII signature for the requesting user and course. If a signature
        already exists, returns the existing signature instead of creating a new one.

        /api/agreements/v1/lti_pii_signature/{course_id}

        Example response:
            {
                username: "janedoe",
                course_id: "org.2/course_2/Run_2",
                created_at: "2021-04-23T18:25:43.511Z"
            }
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/authz/v1/assignments/:
    get:
      operationId: api_authz_v1_assignments_retrieve
      description: Retrieve all user role assignments.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/authz/v1/orgs/:
    get:
      operationId: api_authz_v1_orgs_list
      description: |-
        API view for listing orgs
        This API is used on the filters functionality on the Admin Console.

        **Endpoints**

        - GET: Retrieve all organizations

        **Query Parameters**

        - search (Optional): Search term to filter organizations by name or short name
        - page (Optional): Page number for pagination
        - page_size (Optional): Number of items per page

        **Response Format**

        Returns a paginated list of organization objects, each containing:

        - id: The organization's ID
        - name: The organization's name
        - short_name: The organization's short name

        Results are limited to the orgs of the courses and libraries the requesting user has a
        role assignment in. Staff and superusers see every active org.

        **Authentication and Permissions**

        - Requires authenticated user with either a content library or course view team permission.

        **Example Request**

        GET /api/authz/v1/orgs/?search=edx&page=1&page_size=10

        **Example Response**::

            {
                "count": 1,
                "next": null,
                "previous": null,
                "results": [
                    {
                        "id": 1,
                        "created": "2026-04-02T19:30:36.779095Z",
                        "modified": "2026-04-02T19:30:36.779095Z",
                        "name": "OpenedX",
                        "short_name": "OpenedX",
                        "description": "",
                        "logo": null,
                        "active": true
                    }
                ]
            }
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationList'
          description: ''
  /api/authz/v1/permissions/validate/me:
    post:
      operationId: api_authz_v1_permissions_validate_me_create
      description: Validate one or more permissions for the authenticated user.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/authz/v1/roles/:
    get:
      operationId: api_authz_v1_roles_retrieve
      description: Retrieve all roles and their permissions for a specific scope.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/authz/v1/roles/users/:
    get:
      operationId: api_authz_v1_roles_users_retrieve
      description: Retrieve all users with role assignments within a specific scope.
      tags:
      - api
      responses:
        '200':
          description: No response body
    put:
      operationId: api_authz_v1_roles_users_update
      description: Assign multiple users to a specific role within one or more scopes.
      tags:
      - api
      responses:
        '200':
          description: No response body
    delete:
      operationId: api_authz_v1_roles_users_destroy
      description: Remove multiple users from a specific role within a scope.
      tags:
      - api
      responses:
        '204':
          description: No response body
  /api/authz/v1/scopes/:
    get:
      operationId: api_authz_v1_scopes_list
      description: |-
        API view for listing scopes
        This API is used on the filters and assign roles functionality on the Admin Console.

        **Endpoints**

        - GET: Retrieve all scopes

        **Query Parameters**

        - search (Optional): Search term to filter scopes by display name
        - org (Optional): Filter scopes by org
        - orgs (Optional): Filter scopes by multiple orgs (comma separated list of orgs)
        - page (Optional): Page number for pagination
        - page_size (Optional): Number of items per page
        - scope_type (Optional): Filter scopes by type. Supported values are `course` and `library`.
        - management_permission_only (Optional): Filter scopes either by only the ones to which the user has "manage team"
            permissions (if true), or just "view team" permissions.

        **Response Format**

        Returns a paginated list of scope objects, each containing:

        - external_key: The scope external key
        - display_name: The scope's name
        - org: The organization serialized object

        **Authentication and Permissions**

        - Requires authenticated user with either a content library or course view team permission.

        **Example Request**

        GET /api/authz/v1/scopes/?search=edx&page=1&page_size=10

        **Example Response**::

            {
                "count": 1,
                "next": null,
                "previous": null,
                "results": [
                    {
                        "external_key": "course-v1:OpenedX+DemoX+DemoCourse",
                        "display_name": "Open edX Demo Course",
                        "org": {
                            "id": 1,
                            "created": "2026-04-02T19:30:36.779095Z",
                            "modified": "2026-04-02T19:30:36.779095Z",
                            "name": "OpenedX",
                            "short_name": "OpenedX",
                            "description": "",
                            "logo": null,
                            "active": true
                        }
                    },
                ]
            }
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScopeList'
          description: ''
  /api/authz/v1/users/:
    get:
      operationId: api_authz_v1_users_retrieve
      description: Retrieve all users that have at least one assignation according
        to the filtering fields.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/authz/v1/users/{username}/assignments/:
    get:
      operationId: api_authz_v1_users_assignments_retrieve
      description: Retrieve all user role assignments.
      parameters:
      - in: path
        name: username
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/authz/v1/users/validate/:
    post:
      operationId: api_authz_v1_users_validate_create
      description: Validates the provided usernames or emails correspond to existing
        users.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/authz/v1/waffle-flag-states/:
    get:
      operationId: api_authz_v1_waffle_flag_states_retrieve
      description: Retrieve the enablement state of the course-authoring waffle flag
        across different scopes.
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/bookmarks/v1/bookmarks/:
    get:
      operationId: api_bookmarks_v1_bookmarks_list
      description: |-
        Get a paginated list of bookmarks for a user.

        The list can be filtered by passing parameter "course_id=<course_id>"
        to only include bookmarks from a particular course.

        The bookmarks are always sorted in descending order by creation date.

        Each page in the list contains 10 bookmarks by default. The page
        size can be altered by passing parameter "page_size=<page_size>".

        To include the optional fields pass the values in "fields" parameter
        as a comma separated list. Possible values are:

        * "display_name"
        * "path"

        **Example Requests**

        GET /api/bookmarks/v1/bookmarks/?course_id={course_id1}&fields=display_name,path
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
        description: The id of the course to limit the list
      - in: query
        name: fields
        schema:
          type: string
        description: 'The fields to return: display_name, path.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookmarkList'
          description: ''
    post:
      operationId: api_bookmarks_v1_bookmarks_create
      description: |-
        Create a new bookmark for a user.

        The POST request only needs to contain one parameter "usage_id".

        Http400 is returned if the format of the request is not correct,
        the usage_id is invalid or a block corresponding to the usage_id
        could not be found.

        **Example Requests**

        POST /api/bookmarks/v1/bookmarks/
        Request data: {"usage_id": <usage-id>}
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bookmark'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Bookmark'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Bookmark'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
  /api/bookmarks/v1/bookmarks/{username},{usage_id}/:
    get:
      operationId: api_bookmarks_v1_bookmarks_,_retrieve
      description: |-
        Get a specific bookmark for a user.

        **Example Requests**

        GET /api/bookmarks/v1/bookmarks/{username},{usage_id}?fields=display_name,path
      parameters:
      - in: path
        name: usage_id
        schema:
          type: string
          pattern: ^(?:i4x://?[^/]+/[^/]+/[^/]+/[^@]+(?:@[^/]+)?)|(?:[^/]+)$
        required: true
      - in: path
        name: username
        schema:
          type: string
          pattern: ^[\w .@_+-]+$
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
          description: ''
    delete:
      operationId: api_bookmarks_v1_bookmarks_,_destroy
      description: DELETE /api/bookmarks/v1/bookmarks/{username},{usage_id}
      parameters:
      - in: path
        name: usage_id
        schema:
          type: string
          pattern: ^(?:i4x://?[^/]+/[^/]+/[^/]+/[^@]+(?:@[^/]+)?)|(?:[^/]+)$
        required: true
      - in: path
        name: username
        schema:
          type: string
          pattern: ^[\w .@_+-]+$
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/certificates/v0/certificates/{username}/:
    get:
      operationId: api_certificates_v0_certificates_retrieve
      description: |-
        Get a paginated list of certificates for a user.

        **Use Case**

        Get the list of viewable course certificates for a specific user.

        **Example Request**

        GET /api/certificates/v0/certificates/{username}

        **GET Response Values**

            If the request for information about the user's certificates is successful,
            an HTTP 200 "OK" response is returned.

            The HTTP 200 response contains a list of dicts with the following keys/values.

            * username: A string representation of an user's username passed in the request.

            * course_id: A string representation of a Course ID.

            * course_display_name: A string representation of the Course name.

            * course_organization: A string representation of the organization associated with the Course.

            * certificate_type: A string representation of the certificate type.
                Can be honor|verified|professional

            * created_date: Date/time the certificate was created, in ISO-8661 format.

            * status: A string representation of the certificate status.

            * is_passing: True if the certificate has a passing status, False if not.

            * download_url: A string representation of the certificate url.

            * grade: A string representation of a float for the user's course grade.

        **Example GET Response**

            [{
                "username": "bob",
                "course_id": "edX/DemoX/Demo_Course",
                "certificate_type": "verified",
                "created_date": "2015-12-03T13:14:28+0000",
                "status": "downloadable",
                "is_passing": true,
                "download_url": "http://www.example.com/cert.pdf",
                "grade": "0.98"
            }]
      parameters:
      - in: path
        name: username
        schema:
          type: string
        description: The users to get certificates for
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/certificates/v0/certificates/{username}/courses/{course_id}/:
    get:
      operationId: api_certificates_v0_certificates_courses_retrieve
      description: |-
        Retrieves certificate information for a user in a specified course run.

        Args:
            request (Request): Django request object.
            username (string): URI element specifying the user's username.
            course_id (string): URI element specifying the course location.

        Return:
            A JSON serialized representation of the certificate.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      - in: path
        name: username
        schema:
          type: string
          pattern: ^[\w .@_+-]+$
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/change_email_settings:
    post:
      operationId: api_change_email_settings_create
      description: Modify logged-in user's setting for receiving emails from a course.
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/cohorts/v1/courses/{course_key_string}/cohorts/{cohort_id}:
    get:
      operationId: api_cohorts_v1_courses_cohorts_retrieve
      description: Endpoint to get either one or all cohorts.
      parameters:
      - in: path
        name: cohort_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: course_key_string
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
    post:
      operationId: api_cohorts_v1_courses_cohorts_create
      description: Endpoint to create a new cohort, must not include cohort_id.
      parameters:
      - in: path
        name: cohort_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: course_key_string
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
    patch:
      operationId: api_cohorts_v1_courses_cohorts_partial_update
      description: Endpoint to update a cohort name, assignment type, and/or content
        group association.
      parameters:
      - in: path
        name: cohort_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: course_key_string
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - api
      responses:
        '200':
          description: No response body
  /api/cohorts/v1/courses/{course_key_string}/cohorts/{cohort_id}/users/{username}:
    get:
      operationId: api_cohorts_v1_courses_cohorts_users_retrieve
      description: Lists the users in a specific cohort.
      parameters:
      - in: path
        name: cohort_id
        schema:
          type: string
          pattern: ^[0-9]+$
        required: true
      - in: path
        name: course_key_string
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      - in: path
        name: username
        schema:
          type: string
          pattern: ^.+$
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortUsersAPI'
          description: ''
    post:
