        Arguments:
            request (HttpRequest): The request, used to determine if a pipeline
                is currently running.
            kwargs (dict):
                tpa_hint (string): An override flag that will return a matching provider
                    as long as its configuration has been enabled
                is_register_page (bool): Determine the call is from register or login page
                is_welcome_page (bool): Checks if the call is from the Welcome Page
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/notifications/:
    get:
      operationId: api_notifications_list
      description: |-
        API view for listing notifications for a user.

        **Permissions**: User must be authenticated.
        **Response Format** (paginated):

            {
                "results" : [
                    {
                        "id": (int) notification_id,
                        "app_name": (str) app_name,
                        "notification_type": (str) notification_type,
                        "content": (str) content,
                        "content_context": (dict) content_context,
                        "content_url": (str) content_url,
                        "last_read": (datetime) last_read,
                        "last_seen": (datetime) last_seen
                    },
                    ...
                ],
                "count": (int) total_number_of_notifications,
                "next": (str) url_to_next_page_of_notifications,
                "previous": (str) url_to_previous_page_of_notifications,
                "page_size": (int) number_of_notifications_per_page,

            }

        Response Error Codes:
        - 403: The requester cannot access resource.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
