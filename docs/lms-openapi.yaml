      - openedx-platform-sdk
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CourseEnrollmentAllowed'
          description: GET success — list of allowed enrollments for the email.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseEnrollmentAllowed'
          description: POST success — allowed enrollment created.
        '204':
          description: DELETE success — allowed enrollment deleted.
        '400':
          description: Invalid request data or parameters.
        '403':
          description: The requester does not have permission for this operation.
        '404':
          description: 'DELETE: allowed enrollment not found.'
        '409':
          description: 'POST: allowed enrollment already exists.'
