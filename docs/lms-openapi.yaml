      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - user_api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_api.User'
          description: ''
  /user_api/v2/account/registration/:
    get:
      operationId: user_api_v2_account_registration_retrieve
      description: HTTP end-points for creating a new user.
      tags:
      - user_api
      security:
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: user_api_v2_account_registration_create
      description: |-
        Create the user's account.

        You must send all required form fields with the request.

        You can optionally send a "course_id" param to indicate in analytics
        events that the user registered while enrolling in a particular course.

        Arguments:
            request (HTTPRequest)

        Returns:
            HttpResponse: 200 on success
            HttpResponse: 400 if the request is not valid.
            HttpResponse: 409 if an account with the given username or email
                address already exists
            HttpResponse: 403 operation not allowed
      tags:
      - user_api
      security:
      - {}
      responses:
        '200':
          description: No response body
  /verify_student/decrypt-idv-images/face/{receipt_id}:
    get:
      operationId: verify_student_decrypt_idv_images_face_retrieve
      description: |-
        Endpoint used for decrypting images on stage based on a given receipt ID
        GET /verify_student/decrypt-idv-images/face/{receipt_id}

        Returns:
            200 OK
            {
                img
            }
      parameters:
      - in: path
        name: receipt_id
        schema:
          type: string
          pattern: ^[0-9a-z]{8}-([0-9a-z]{4}-){3}[0-9a-z]{12}$
        required: true
      tags:
      - verify_student
      security:
      - {}
      responses:
        '200':
          description: No response body
  /verify_student/decrypt-idv-images/photo-id/{receipt_id}:
    get:
      operationId: verify_student_decrypt_idv_images_photo_id_retrieve
      description: |-
        Endpoint used for decrypting images on stage based on a given receipt ID
        GET /verify_student/decrypt-idv-images/photo-id/{receipt_id}

        Returns:
            200 OK
            {
                img
            }
      parameters:
      - in: path
        name: receipt_id
        schema:
          type: string
          pattern: ^[0-9a-z]{8}-([0-9a-z]{4}-){3}[0-9a-z]{12}$
        required: true
      tags:
      - verify_student
      security:
      - {}
      responses:
        '200':
          description: No response body
  /verify_student/photo-urls/{receipt_id}:
    get:
      operationId: verify_student_photo_urls_retrieve
      description: |-
        Endpoint for retrieving photo urls for IDV
        GET /verify_student/photo-urls/{receipt_id}

        Returns:
            200 OK
            {
                "EdX-ID": receipt_id,
                "ExpectedName": user profile name,
                "PhotoID": id photo S3 url,
                "PhotoIDKey": encrypted photo id key,
                "UserPhoto": face photo S3 url,
                "UserPhotoKey": encrypted user photo key,
            }
      parameters:
      - in: path
        name: receipt_id
        schema:
          type: string
          pattern: ^[0-9a-z]{8}-([0-9a-z]{4}-){3}[0-9a-z]{12}$
        required: true
      tags:
      - verify_student
      security:
      - {}
      responses:
        '200':
          description: No response body
  /verify_student/status/:
    get:
      operationId: verify_student_status_retrieve
      description: Handle the GET request.
      tags:
      - verify_student
      security:
      - {}
      responses:
        '200':
          description: No response body
  /xblocks/v2/{usage_key}/embed/{view_name}/:
    get:
      operationId: xblocks_v2_embed_retrieve
      description: |-
        Render the given XBlock in an <iframe>

        Unstable - may change after Sumac
      parameters:
      - in: path
        name: usage_key
        schema:
          type: string
          pattern: ^[\w-]+(:[\w\-.]+)+$
        required: true
      - in: path
        name: view_name
        schema:
          type: string
        required: true
      tags:
      - xblocks
      responses:
        '200':
          description: No response body
  /xqueue/get_submission/:
    get:
      operationId: xqueue_get_submission_retrieve
      description: |-
        Endpoint for retrieving a single unprocessed submission from a specified queue.
        Query Parameters:
        - queue_name (required): Name of the queue to pull from
        Returns:
        - Submission data with pull information if successful
        - Error message if queue is empty or invalid
      tags:
      - xqueue
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /xqueue/login/:
    get:
      operationId: xqueue_login_retrieve
      description: |-
        Endpoint for authenticating users and creating sessions.

        GET: Sets the CSRF cookie so that xqueue-watcher can extract the token
        before POSTing credentials.  Returns an empty success response.

        POST: Authenticates the supplied username/password and opens a session.
      tags:
      - xqueue
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: xqueue_login_create
      description: |-
        Endpoint for authenticating users and creating sessions.

        GET: Sets the CSRF cookie so that xqueue-watcher can extract the token
        before POSTing credentials.  Returns an empty success response.

        POST: Authenticates the supplied username/password and opens a session.
      tags:
      - xqueue
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /xqueue/logout/:
    post:
      operationId: xqueue_logout_create
      description: Endpoint for ending user sessions.
      tags:
      - xqueue
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /xqueue/put_result/:
    post:
      operationId: xqueue_put_result_create
      description: Endpoint for graders to post their results and update submission
        scores.
      tags:
      - xqueue
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /xqueue/status/:
    post:
      operationId: xqueue_status_create
      description: |-
        A collection of services for xqueue-watcher interactions and authentication.

        This ViewSet provides endpoints for managing external grader results
        and handling user authentication in the system.

        Key features:
        - Handles validation of external grader responses
        - Processes and updates submission scores
        - Provides a secure endpoint for result updates
        - Manages user authentication and session handling

        Endpoints:
        - put_result: Endpoint for graders to submit their assessment results
        - get_submission: Endpoint for fetch pending submissions
        - login: Endpoint for user authentication
        - logout: Endpoint for ending user sessions

        HTTP Status Codes:
        In contrast to previous implementations that always returned HTTP 200 status
        codes and relied solely on the JSON response body to indicate success or failure,
        this implementation returns HTTP status codes that more accurately reflect the
        outcome of each request (such as 400, 401, 403, or 404 for error conditions).
        This change improves API clarity and error handling.

        NOTE: This viewset is intentionally re-building an API-compatible implementation for
        xqueue-watcher. Some non-standard choices (such as response formats and status code
        handling) are made to maintain compatibility with the legacy xqueue-watcher client.
        For more context, see DEPR: https://github.com/openedx/public-engineering/issues/286.
      tags:
      - xqueue
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /zendesk_proxy/v0:
    post:
      operationId: zendesk_proxy_v0_create
      description: |-
        request body is expected to look like this:
        {
            "name": "John Q. Student",
            "email": {
                "from": "JohnQStudent@realemailhost.com",
                "message": "I, John Q. Student, am having problems for the following reasons: ...",
                "subject": "Help Request"
            },
            "tags": ["zendesk_help_request"]
        }
      tags:
      - zendesk_proxy
      security:
      - {}
      responses:
        '200':
          description: No response body
  /zendesk_proxy/v1:
    post:
      operationId: zendesk_proxy_v1_create
      description: |-
        request body is expected to look like this:
        {
            "requester": {
                "email": "john@example.com",
                "name": "name"
            },
            "subject": "test subject",
            "comment": {
                "body": "message details",
                "uploads": ['file_token'],
            },
            "custom_fields": [
                {
                    "id": '001',
                    "value": 'demo-course'
                }
            ],
            "tags": ["LMS"]
        }
      tags:
      - zendesk_proxy
      security:
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    Access:
      type: object
      description: |-
        Serializer for managing user access changes.
        This serializer validates and processes the data required to modify
        user access within a system.
      properties:
        unique_student_identifier:
          type: string
          description: Email or username of user to change access
          maxLength: 255
        rolename:
          type: string
          description: Role name to assign to the user
        action:
          allOf:
          - $ref: '#/components/schemas/Action2cbEnum'
          description: |-
            Action to perform on the user's access

            * `allow` - allow
            * `revoke` - revoke
      required:
      - action
      - rolename
      - unique_student_identifier
    AccountGetMe:
      type: object
      properties:
        username:
          type: string
      required:
      - username
    Action2cbEnum:
      enum:
      - allow
      - revoke
      type: string
      description: |-
        * `allow` - allow
        * `revoke` - revoke
    ActionF18Enum:
      enum:
      - add
      - remove
      type: string
      description: |-
        * `add` - add
        * `remove` - remove
    AllowanceUser:
      type: object
      description: Serializer for user info within an allowance (uses 'id' directly).
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
      required:
      - email
      - id
      - username
    ApiAccessRequest:
      type: object
      description: ApiAccessRequest serializer.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Status of this API access request

            * `pending` - Pending
            * `denied` - Denied
            * `approved` - Approved
        website:
          type: string
          format: uri
          description: The URL of the website associated with this API user.
          maxLength: 200
        reason:
          type: string
          description: The reason this user wants to access the API.
        company_name:
          type: string
          maxLength: 255
        company_address:
          type: string
          maxLength: 255
        site:
          type: integer
        contacted:
          type: boolean
      required:
      - created
      - id
      - modified
      - reason
      - site
      - user
      - website
    AssignmentTypeScores:
      type: object
      description: Serializer for aggregated scores per assignment type.
      properties:
        type:
          type: string
        weight:
          type: number
          format: double
        average_grade:
          type: number
          format: double
        weighted_grade:
          type: number
          format: double
        last_grade_publish_date:
          type: string
          format: date-time
        has_hidden_contribution:
          type: string
        short_label:
          type: string
        num_droppable:
          type: integer
      required:
      - average_grade
      - has_hidden_contribution
      - last_grade_publish_date
      - num_droppable
      - short_label
      - type
      - weight
      - weighted_grade
    AsyncOperationResult:
      type: object
      description: Serializer for asynchronous grading operation results.
      properties:
        task_id:
          type: string
          description: Unique task identifier
        status_url:
          type: string
          description: URL to poll for task status
        scope:
          type: object
          additionalProperties: {}
          description: Scope of the operation
      required:
      - status_url
      - task_id
    BetaTesterModifyRequestSerializerV2:
      type: object
      description: Validates request body for adding/removing one or more beta testers.
      properties:
        identifier:
          type: array
          items:
            type: string
            maxLength: 255
          description: List of email addresses or usernames of learners to add/remove
            as beta testers.
        action:
          allOf:
          - $ref: '#/components/schemas/ActionF18Enum'
          description: |-
            The beta tester action to perform: 'add' or 'remove'.

            * `add` - add
            * `remove` - remove
        email_students:
          type: boolean
          default: false
          description: Whether to send an email notification.
        auto_enroll:
          type: boolean
          default: false
          description: Whether to auto-enroll the user in the course (add action only).
      required:
      - action
      - identifier
    BetaTesterModifyResponseSerializerV2:
      type: object
      description: Documents the response shape for the bulk beta tester add/remove
        endpoint (mirrors v1).
      properties:
        action:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/BetaTesterModifyResultSerializerV2'
      required:
      - action
      - results
    BetaTesterModifyResultSerializerV2:
      type: object
      description: Documents the per-identifier result shape for beta tester modifications
        (mirrors v1).
      properties:
        identifier:
          type: string
        error:
          type: boolean
        user_does_not_exist:
          type: boolean
        is_active:
          type: boolean
          nullable: true
      required:
      - error
      - identifier
      - is_active
      - user_does_not_exist
    BlackoutDate:
      type: object
      description: Serializer for blackout dates.
      properties:
        start:
          type: string
          format: date-time
          description: The ISO 8601 timestamp for the start of the blackout period
        end:
          type: string
          format: date-time
          description: The ISO 8601 timestamp for the end of the blackout period
      required:
      - end
      - start
    BlankEnum:
      enum:
      - ''
    BlockDueDate:
      type: object
      description: |-
        Serializer for handling block due date updates for a specific student.
        Fields:
            url (str): The URL related to the block that needs the due date update.
            due_datetime (str): The new due date and time for the block.
            student (str): The email or username of the student whose access is being modified.
            reason (str): Reason why updating this.
      properties:
        url:
          type: string
        due_datetime:
          type: string
        student:
          type: string
          description: Email or username of user to change access
          maxLength: 255
        reason:
          type: string
      required:
      - due_datetime
      - student
      - url
    BlockDueDateSerializerV2:
      type: object
      description: |-
        Serializer for handling block due date updates for a specific student.
        Fields:
            block_id (str): The ID related to the block that needs the due date update.
            due_datetime (str): The new due date and time for the block.
            email_or_username (str): The email or username of the student whose access is being modified.
            reason (str, optional): Reason why updating this.
      properties:
        block_id:
          type: string
        due_datetime:
          type: string
        email_or_username:
          type: string
          description: Email or username of user to change access
          maxLength: 255
        reason:
          type: string
          default: ''
      required:
      - block_id
      - due_datetime
      - email_or_username
    Bookmark:
      type: object
      description: Serializer for the Bookmark model.
      properties:
        id:
          type: string
          readOnly: true
          description: 'The identifier string for the bookmark: {user_id},{usage_id}.'
        course_id:
          type: string
          description: The identifier string of the bookmark's course.
        usage_id:
          type: string
          description: The identifier string of the bookmark's XBlock.
        block_type:
          type: string
          readOnly: true
        display_name:
          type: string
          readOnly: true
          description: Display name of the XBlock.
        path:
          type: string
          readOnly: true
          description: "\n            List of dicts containing {\"usage_id\": <usage-id>,
            display_name:<display-name>}\n            for the XBlocks from the top
            of the course tree till the parent of the bookmarked XBlock.\n        "
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - block_type
      - course_id
      - created
      - display_name
      - id
      - path
      - usage_id
    Certificate:
      type: object
      description: |-
        Serializer for multiple operations related with certificates.
        resetting a students attempts counter or starts a task to reset all students
        attempts counters
        Also Add/Remove students to/from the certificate allowlist.
        Also For resetting a students attempts counter or starts a task to reset all students
        attempts counters.
      properties:
        user:
          type: string
          description: Email or username of student.
        notes:
          type: string
          nullable: true
      required:
      - user
    CertificateData:
      type: object
      description: Serializer for certificate data
      properties:
        cert_status:
          type: string
        cert_web_view_url:
          type: string
        download_url:
          type: string
        certificate_available_date:
          type: string
          format: date-time
      required:
      - cert_status
      - cert_web_view_url
      - certificate_available_date
      - download_url
    CertificateGenerationHistory:
      type: object
      description: |-
        Serializer for certificate generation history.
        Accepts CertificateGenerationHistory model instances.
      properties:
        task_name:
          type: string
          readOnly: true
          description: Task name (Generated or Regenerated)
        date:
          type: string
          format: date-time
          description: Date when the task was created in ISO 8601 format
        details:
          type: string
          readOnly: true
          description: Details about the certificate generation (e.g., 'audit not
