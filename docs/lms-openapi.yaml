    CourseInformationSerializerV2:
      type: object
      description: |-
        Serializer for comprehensive course information.

        This serializer handles the business logic for gathering all course metadata,
        enrollment statistics, permissions, and dashboard configuration.
      properties:
        course_id:
          type: string
          readOnly: true
          description: Course run key
        username:
          type: string
          readOnly: true
          description: Username of the current authenticated user
        display_name:
          type: string
          readOnly: true
          description: Course display name
        org:
          type: string
          readOnly: true
          description: Organization identifier
        course_number:
          type: string
          readOnly: true
          description: Course number
        course_run:
          type: string
          readOnly: true
          description: Course run identifier
        enrollment_start:
          type: string
          readOnly: true
          description: Enrollment start date (ISO 8601 with timezone)
        enrollment_end:
          type: string
          readOnly: true
          description: Enrollment end date (ISO 8601 with timezone)
        start:
          type: string
          readOnly: true
          description: Course start date (ISO 8601 with timezone)
        end:
          type: string
          readOnly: true
          description: Course end date (ISO 8601 with timezone)
        pacing:
          type: string
          readOnly: true
          description: Course pacing type (self or instructor)
        has_started:
          type: string
          readOnly: true
          description: Whether the course has started based on current time
        has_ended:
          type: string
          readOnly: true
          description: Whether the course has ended based on current time
        total_enrollment:
          type: string
          readOnly: true
          description: Total number of enrollments across all modes
        learner_count:
          type: string
          readOnly: true
          description: Number of enrolled learners (excludes staff and admins)
        staff_count:
          type: string
          readOnly: true
          description: Number of enrolled staff and admins
        enrollment_counts:
          type: string
          readOnly: true
          description: Enrollment count breakdown by mode
        num_sections:
          type: string
          readOnly: true
          description: Number of sections/chapters in the course
        grade_cutoffs:
          type: string
          readOnly: true
          description: Formatted string of grade cutoffs
        course_errors:
          type: string
          readOnly: true
          description: List of course validation errors from modulestore
        studio_url:
          type: string
          readOnly: true
          description: URL to view/edit course in Studio
        gradebook_url:
          type: string
          readOnly: true
          description: URL to the MFE gradebook for the course (null if not configured)
        studio_grading_url:
          type: string
          readOnly: true
          description: URL to the Studio grading settings page for the course (null
            if not configured)
        admin_console_url:
          type: string
          readOnly: true
          description: URL to the admin console (requires instructor access and MFE
            configuration, null if not accessible)
        permissions:
          type: string
          readOnly: true
          description: User permissions for instructor dashboard features
        tabs:
          type: string
          readOnly: true
          description: List of course tabs with configuration and display information
        disable_buttons:
          type: string
          readOnly: true
          description: Whether to disable certain bulk action buttons due to large
            course size
        analytics_dashboard_message:
          type: string
          readOnly: true
          description: Message about analytics dashboard availability
        certificates_enabled:
          type: string
          readOnly: true
          description: Whether certificate management features are enabled for this
            course
      required:
      - admin_console_url
      - analytics_dashboard_message
      - certificates_enabled
      - course_errors
      - course_id
      - course_number
      - course_run
      - disable_buttons
      - display_name
      - end
      - enrollment_counts
      - enrollment_end
      - enrollment_start
      - grade_cutoffs
      - gradebook_url
      - has_ended
      - has_started
      - learner_count
      - num_sections
      - org
      - pacing
      - permissions
      - staff_count
      - start
      - studio_grading_url
      - studio_url
      - tabs
      - total_enrollment
      - username
    CourseKey:
      type: string
    CourseLiveConfiguration:
      type: object
      description: Serialize configuration responses
      properties:
        course_key:
          type: string
          readOnly: true
        provider_type:
          type: string
          title: LTI provider
          description: The LTI provider's id
          maxLength: 50
        enabled:
          type: boolean
          description: If disabled, the LTI in the associated course will be disabled.
        lti_configuration:
          $ref: '#/components/schemas/Lti'
        pii_sharing_allowed:
          type: string
          readOnly: true
        free_tier:
          type: boolean
          description: True, if LTI credential are provided by Org globally
      required:
      - course_key
      - pii_sharing_allowed
      - provider_type
    CourseMetadataSerailizer:
      type: object
      description: Serializer for course metadata.
      properties:
        id:
          type: string
          description: The identifier of the course
        blackouts:
          type: array
          items:
            $ref: '#/components/schemas/BlackoutDate'
          description: A list of objects representing blackout periods (during which
            discussions are read-only except for privileged users).
        thread_list_url:
          type: string
          format: uri
          description: The URL of the list of all threads in the course.
        following_thread_list_url:
          type: string
          format: uri
          description: thread_list_url with parameter following=True
        topics_url:
          type: string
          format: uri
          description: The URL of the topic listing for the course.
        allow_anonymous:
          type: boolean
          description: A boolean indicating whether anonymous posts are allowed or
            not.
        allow_anonymous_to_peers:
          type: boolean
          description: A boolean indicating whether posts anonymous to peers are allowed
            or not.
        user_roles:
          type: array
          items:
            type: string
          description: A list of all the roles the requesting user has for this course.
        user_is_privileged:
          type: boolean
          description: A boolean indicating if the current user has a privileged role
        provider:
          type: string
          description: The discussion provider used by this course
        enable_in_context:
          type: boolean
          description: A boolean indicating whether in-context discussion is enabled
            for the course
        group_at_subsection:
          type: boolean
          description: A boolean indicating whether discussions should be grouped
            at subsection
        post_close_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCodeSeralizer'
          description: A list of reasons that can be specified by moderators for closing
            a post
        edit_reasons:
          type: array
          items:
            $ref: '#/components/schemas/ReasonCodeSeralizer'
          description: A list of reasons that can be specified by moderators for editing
            a post, response, or comment
      required:
      - allow_anonymous
      - allow_anonymous_to_peers
      - blackouts
      - edit_reasons
      - enable_in_context
      - following_thread_list_url
      - group_at_subsection
      - id
      - post_close_reasons
      - provider
      - thread_list_url
      - topics_url
      - user_is_privileged
      - user_roles
    CourseModeSerrializer:
      type: object
      description: Serializer for the Course Mode
      properties:
        slug:
          type: string
        name:
          type: string
      required:
      - name
