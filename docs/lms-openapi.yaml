    Organization:
      type: object
      description: Serializes the Organization object.
      properties:
        id:
          type: integer
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          description: Unique, short string identifier for organization. Please do
            not use spaces or special characters. Only allowed special characters
            are period (.), hyphen (-) and underscore (_).
          maxLength: 255
        description:
          type: string
          nullable: true
