    ListInstructorTaskInput:
      type: object
      description: |-
        Serializer for handling the input data for the problem response report generation API.

        Attributes:
            unique_student_identifier (str): The email or username of the student.
                                              This field is optional, but if provided, the `problem_location_str`
                                              must also be provided.
            problem_location_str (str): The string representing the location of the problem within the course.
                                        This field is optional, unless `unique_student_identifier` is provided.
      properties:
        unique_student_identifier:
          type: string
          description: Email or username of student
          maxLength: 255
        problem_location_str:
          type: string
          description: Problem location
    LoginUserRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    LoginUserResponse:
      type: object
      properties:
        success:
          type: boolean
        value:
          type: string
        error_code:
          type: string
      required:
      - error_code
      - success
      - value
    Lti:
      type: object
      description: Serialize LtiConfiguration responses
      properties:
        lti_1p1_client_key:
          type: string
          description: Client key provided by the LTI tool provider.
          maxLength: 255
        lti_1p1_client_secret:
          type: string
          writeOnly: true
          description: Client secret provided by the LTI tool provider.
          maxLength: 255
        lti_1p1_launch_url:
          type: string
          description: The URL of the external tool that initiates the launch.
          maxLength: 255
        version:
          $ref: '#/components/schemas/VersionEnum'
        lti_config: {}
      required:
      - lti_config
    LtiAgsLineItem:
      type: object
      description: |-
        LTI AGS LineItem Serializer.

        This maps out the internally stored LineItemParameters to
        the LTI-AGS API Specification, as shown in the example
        response below:

        {
            "id" : "https://lms.example.com/context/2923/lineitems/1",
            "scoreMaximum" : 60,
            "label" : "Chapter 5 Test",
            "resourceId" : "a-9334df-33",
            "tag" : "grade",
            "resourceLinkId" : "1g3k4dlk49fk",
            "startDateTime": "2018-03-06T20:05:02Z",
            "endDateTime": "2018-04-06T22:05:03Z",
        }

        Reference:
        https://www.imsglobal.org/spec/lti-ags/v2p0#example-application-vnd-ims-lis-v2-lineitem-json-representation
      properties:
        id:
          type: string
          readOnly: true
        resourceId:
          type: string
        scoreMaximum:
          type: integer
        label:
          type: string
          maxLength: 100
        tag:
          type: string
          maxLength: 50
        resourceLinkId:
          type: string
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
      required:
      - id
      - label
      - scoreMaximum
    Membership:
      type: object
      description: Serializes CourseTeamMemberships with information about both teams
        and users.
      properties:
        user:
          type: string
        team:
          type: string
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_activity_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - date_joined
      - last_activity_at
      - team
      - user
    ModifyAccess:
      type: object
      description: serializers for enroll or un-enroll users in beta testing program.
      properties:
        identifiers:
          type: string
          description: A comma separated list of emails or usernames.
        action:
          allOf:
          - $ref: '#/components/schemas/ActionF18Enum'
          description: |-
            Action to perform: add or remove.

            * `add` - add
            * `remove` - remove
        email_students:
          type: boolean
          default: false
          description: Boolean flag to indicate if students should be emailed.
        auto_enroll:
          type: boolean
          default: false
          description: Boolean flag to indicate if the user should be auto-enrolled.
      required:
      - action
      - identifiers
    Notification:
      type: object
      description: Serializer for the Notification model.
      properties:
        id:
          type: integer
          readOnly: true
        app_name:
          type: string
          maxLength: 64
        notification_type:
          type: string
          maxLength: 64
        content_context: {}
        content:
          type: string
          readOnly: true
        content_url:
          nullable: true
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        course_id:
          type: string
          nullable: true
          maxLength: 255
        last_read:
          type: string
          format: date-time
          nullable: true
        last_seen:
          type: string
          format: date-time
          nullable: true
        created:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_name
      - content
      - created
      - id
      - notification_type
