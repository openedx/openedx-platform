        course_key: required argument, needed to authorize course authors and identify the asset.
        asset_key_string: required argument, needed to identify the asset.
      parameters:
      - in: path
        name: asset_key_string
        schema:
          type: string
          pattern: ^(?:/?c4x(:/)?/[^/]+/[^/]+/[^/]+/[^@]+(?:@[^/]+)?)|(?:[^/]+)$
        required: true
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Asset'
          '*/*':
            schema:
              $ref: '#/components/schemas/Asset'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    patch:
      operationId: v0_file_assets_partial_update
      description: |-
        public rest API endpoints for the CMS API Assets.
        course_key: required argument, needed to authorize course authors and identify the asset.
        asset_key_string: required argument, needed to identify the asset.
      parameters:
      - in: path
        name: asset_key_string
        schema:
          type: string
          pattern: ^(?:/?c4x(:/)?/[^/]+/[^/]+/[^/]+/[^@]+(?:@[^/]+)?)|(?:[^/]+)$
        required: true
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAsset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAsset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAsset'
          '*/*':
            schema:
              $ref: '#/components/schemas/PatchedAsset'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    delete:
      operationId: v0_file_assets_destroy
      description: |-
        public rest API endpoints for the CMS API Assets.
        course_key: required argument, needed to authorize course authors and identify the asset.
        asset_key_string: required argument, needed to identify the asset.
      parameters:
      - in: path
        name: asset_key_string
        schema:
          type: string
          pattern: ^(?:/?c4x(:/)?/[^/]+/[^/]+/[^/]+/[^@]+(?:@[^/]+)?)|(?:[^/]+)$
        required: true
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - v0
      responses:
        '204':
          description: No response body
  /v0/grading/{course_id}:
    post:
      operationId: v0_grading_create
      description: |-
        Update a course's grading.

        **Example Request**

            POST /api/contentstore/v0/course_grading/{course_id}

        **POST Parameters**

        The data sent for a post request should follow next object.
        Here is an example request data that updates the ``course_grading``

        ```json
        {
            "graders": [
                {
                    "type": "Homework",
                    "min_count": 1,
                    "drop_count": 0,
                    "short_label": "",
                    "weight": 100,
                    "id": 0
                }
            ],
            "grade_cutoffs": {
                "A": 0.75,
                "B": 0.63,
                "C": 0.57,
                "D": 0.5
            },
            "grace_period": {
                "hours": 12,
                "minutes": 0
            },
            "minimum_grade_credit": 0.7,
            "is_credit_course": true
        }
        ```

        **Response Values**

        If the request is successful, an HTTP 200 "OK" response is returned,
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authoring_grading.CourseGrading.v0'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/authoring_grading.CourseGrading.v0'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/authoring_grading.CourseGrading.v0'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authoring_grading.CourseGrading.v0'
          description: ''
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/heartbeat:
    get:
      operationId: v0_heartbeat_retrieve
      description: |-
        Get an object containing the Authoring API's status

        **Example Request**

            GET /api/contentstore/v0/heartbeat

        **Response Values**

        If the request is successful, an HTTP 200 "OK" response is returned.
        The HTTP 200 response contains a single dict with the  "content_api_enabled" value "True".

        **Example Response**

        ```json
        {
            "content_api_enabled": "True"
        }
        ```
      tags:
      - v0
      security:
      - {}
      responses:
        '200':
          description: The API is online
        '401':
          description: The requester is not authenticated.
        '403':
          description: The API is not availible
  /v0/link_check/{course_id}:
    post:
      operationId: v0_link_check_create
      description: |-
        Queue celery task to scan a course for broken links.

        **Example Request**
            POST /api/contentstore/v0/link_check/{course_id}

        **Response Values**
        ```json
        {
            "LinkCheckStatus": "Pending"
        }
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      responses:
        '200':
          description: Celery task queued.
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/link_check_status/{course_id}:
    get:
      operationId: v0_link_check_status_retrieve
      description: |-
        **Use Case**

            GET handler to return the status of the link_check task from UserTaskStatus.
            If no task has been started for the course, return 'Uninitiated'.
            If link_check task was successful, an output result is also returned.

            For reference, the following status are in UserTaskStatus:
                'Pending', 'In Progress' (sent to frontend as 'In-Progress'),
                'Succeeded', 'Failed', 'Canceled', 'Retrying'
            This function adds a status for when status from UserTaskStatus is None:
                'Uninitiated'

        **Example Request**

            GET /api/contentstore/v0/link_check_status/{course_id}

        **Example Response**

        ```json
        {
            "LinkCheckStatus": "Succeeded",
            "LinkCheckCreatedAt": "2025-02-05T14:32:01.294587Z",
            "LinkCheckOutput": {
                "sections": [
                    {
                        "id": <string>,
                        "displayName": <string>,
                        "subsections": [
                            {
                                "id": <string>,
                                "displayName": <string>,
                                "units": [
                                    {
                                        "id": <string>,
                                        "displayName": <string>,
                                        "blocks": [
                                            {
                                                "id": <string>,
                                                "url": <string>,
                                                "brokenLinks": [<string>, ...],
                                                "lockedLinks": [<string>, ...],
                                                "externalForbiddenLinks": [<string>, ...],
                                                "previousRunLinks": [
                                                    {
                                                        "originalLink": <string>,
                                                        "isUpdated": <boolean>,
                                                        "updatedLink": <string>
                                                    },
                                                    ...
                                                ]
                                            },
                                            { <another block> },
                                        ],
                                    },
                                    { <another unit> },
                                ],
                            },
                            { <another subsection },
                        ],
                    },
                    { <another section> },
                ],
                "course_updates": [
                    {
                        "id": <string>,
                        "displayName": <string>,
                        "url": <string>,
                        "brokenLinks": [<string>, ...],
                        "lockedLinks": [<string>, ...],
                        "externalForbiddenLinks": [<string>, ...],
                        "previousRunLinks": [
                            {
                                "originalLink": <string>,
                                "isUpdated": <boolean>,
                                "updatedLink": <string>
                            },
                            ...
                        ]
                    },
                    ...,
                    { <another course-updates> },
                    ...,
                    {
                        "id": <string>,
                        "displayName": "handouts",
                        "url": <string>,
                        "brokenLinks": [<string>, ...],
                        "lockedLinks": [<string>, ...],
                        "externalForbiddenLinks": [<string>, ...],
                        "previousRunLinks": [
                            {
                                "originalLink": <string>,
                                "isUpdated": <boolean>,
                                "updatedLink": <string>
                            },
                            ...
                        ]
                    }
                ],
                "custom_pages": [
                    {
                        "id": <string>,
                        "displayName": <string>,
                        "url": <string>,
                        "brokenLinks": [<string>, ...],
                        "lockedLinks": [<string>, ...],
                        "externalForbiddenLinks": [<string>, ...],
                        "previousRunLinks": [
                            {
                                "originalLink": <string>,
                                "isUpdated": <boolean>,
                                "updatedLink": <string>
                            },
                            ...
                        ]
                    },
                    ...,
                    { <another page> },
                ]
            },
        }
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      responses:
        '200':
          description: OK
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/rerun_link_update/{course_id}:
    post:
      operationId: v0_rerun_link_update_create
      description: |-
        Queue celery task to update course links to the latest re-run.

        **Example Request - Update All Links**
            POST /api/contentstore/v0/rerun_link_update/{course_id}
            ```json
            {
                "action": "all"
            }
            ```

        **Example Request - Update Single Links**
            POST /api/contentstore/v0/rerun_link_update/{course_id}
            ```json
            {
                "action": "single",
                "data": [
                    {
                        "url": "http://localhost:18000/course/course-v1:edX+DemoX+Demo_Course/course",
                        "type": "course_updates",
                        "id": "block_id_123"
                    }
                ]
            }
            ```

        **Response Values**
        ```json
        {
            "status": "pending"
        }
        ```
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRerunLinkUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseRerunLinkUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseRerunLinkUpdateRequest'
        required: true
      responses:
        '200':
          description: Celery task queued.
        '400':
          description: Bad request - invalid action or missing data.
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/rerun_link_update_status/{course_id}:
    get:
      operationId: v0_rerun_link_update_status_retrieve
      description: |-
        **Use Case**

            GET handler to return the status of the course link update task from UserTaskStatus.
            If no task has been started for the course, return 'uninitiated'.
            If the task was successful, the updated links results are also returned.

            Possible statuses:
                'pending', 'in_progress', 'completed', 'failed', 'uninitiated'

        **Example Request**

            GET /api/contentstore/v0/rerun_link_update_status/{course_id}

        **Example Response - Task In Progress**

        ```json
        {
            "status": "pending"
        }
        ```

        **Example Response - Task Completed**

        ```json
        {
            "status": "completed",
            "results": [
                {
                    "id": "block_id_123",
                    "type": "course_updates",
                    "new_url": "http://localhost:18000/course/course-v1:edX+DemoX+2024_Q2/course",
                    "success": true
                },
                {
                    "id": "block_id_456",
                    "type": "course_updates",
                    "new_url": "http://localhost:18000/course/course-v1:edX+DemoX+2024_Q2/progress",
                    "success": true
                }
            ]
        }
        ```

        **Example Response - Task Failed**

        ```json
        {
            "status": "failed",
            "error": "Target course run not found or inaccessible"
        }
        ```
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      responses:
        '200':
          description: OK
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/tabs/{course_id}:
    get:
      operationId: v0_tabs_retrieve
      description: |-
        Get a list of all the tabs in a course including hidden tabs.

        **Example Request**

            GET /api/contentstore/v0/tabs/{course_id}

        **Response Values**

        If the request is successful, an HTTP 200 "OK" response is returned.

        The HTTP 200 response contains a list of objects that contain info
        about each tab.

        **Example Response**

        ```json
        [
            {
                "course_staff_only": false,
                "is_hidden": false,
                "is_hideable": false,
                "is_movable": false,
                "name": "Home",
                "settings": {},
                "tab_id": "info",
                "title": "Home",
                "type": "course_info"
            },
            {
                "course_staff_only": false,
                "is_hidden": false,
                "is_hideable": false,
                "is_movable": false,
                "name": "Course",
                "settings": {},
                "tab_id": "courseware",
                "title": "Course",
                "type": "courseware"
            },
            ...
        }
        ```
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseTab'
          description: ''
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/tabs/{course_id}/reorder:
    post:
      operationId: v0_tabs_reorder_create
      description: |-
        Reorder tabs in a course.

        **Example Requests**

        Move course tabs:

            POST /api/contentstore/v0/tabs/{course_id}/reorder [
                {
                    "tab_locator": "block-v1:TstX+DemoX+Demo+type@static_tab+block@d26fcb0e93824fbfa5c9e5f100e2511a"
                },
                {
                    "tab_locator": "block-v1:TstX+DemoX+Demo+type@static_tab+block@a011f1bd05af4578ae397ed8cabccf62"
                },
            ]


        **Response Values**

        If the request is successful, an HTTP 204 response is returned
        without any content.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TabIDLocator'
          application/x-www-form-urlencoded:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TabIDLocator'
          multipart/form-data:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TabIDLocator'
        required: true
      responses:
        '204':
          description: In case of success, a 204 is returned with no content.
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/tabs/{course_id}/settings:
    post:
      operationId: v0_tabs_settings_create
      description: |-
        Change visibility of tabs in a course.

        **Example Requests**

        You can provide either a tab_id or a tab_location.

        Hide a course tab using ``tab_id``:

            POST /api/contentstore/v0/tabs/{course_id}/settings/?tab_id={tab_id} {
                "is_hidden": true
            }

        Hide a course tab using ``tab_location``

            POST /api/contentstore/v0/tabs/{course_id}/settings/?tab_location={tab_location} {
                "is_hidden": true
            }

        **Response Values**

        If the request is successful, an HTTP 204 response is returned
        without any content.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      - in: query
        name: tab_id
        schema:
          type: string
        description: Tab ID
      - in: query
        name: tab_location
        schema:
          type: string
        description: Tab usage key
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseTabUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseTabUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseTabUpdate'
        required: true
      responses:
        '204':
          description: In case of success, a 204 is returned with no content.
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
