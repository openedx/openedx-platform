openapi: 3.0.3
info:
  title: Authoring API
  version: 0.1.0
  description: Experimental API to edit xblocks and course content.
paths:
  /v0/advanced_settings/{course_id}:
    get:
      operationId: v0_advanced_settings_retrieve
      description: |-
        Get an object containing all the advanced settings in a course.

        **Example Request**

            GET /api/contentstore/v0/advanced_settings/{course_id}

        **Response Values**

        If the request is successful, an HTTP 200 "OK" response is returned.

        The HTTP 200 response contains a single dict that contains keys that
        are the course's advanced settings. For each setting a dictionary is
        returned that contains the following fields:

        * **deprecated**: This is true for settings that are deprecated.
        * **display_name**: This is a friendly name for the setting.
        * **help**: Contains help text that explains how the setting works.
        * **value**: Contains the value of the setting. The exact format
          depends on the setting and is often explained in the ``help`` field
          above.

        There may be other fields returned by the response.

        **Example Response**

        ```json
        {
            "display_name": {
                "value": "Demonstration Course",
                "display_name": "Course Display Name",
                "help": "Enter the name of the course as it should appear in the course list.",
                "deprecated": false,
                "hide_on_enabled_publisher": false
            },
            "course_edit_method": {
                "value": "Studio",
                "display_name": "Course Editor",
                "help": "Enter the method by which this course is edited ("XML" or "Studio").",
                "deprecated": true,
                "hide_on_enabled_publisher": false
            },
            "days_early_for_beta": {
                "value": null,
                "display_name": "Days Early for Beta Users",
                "help": "Enter the number of days before the start date that beta users can access the course.",
                "deprecated": false,
                "hide_on_enabled_publisher": false
            },
            ...
        }
        ```
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      - in: query
        name: fetch_all
        schema:
          type: string
        description: Specifies whether to fetch all settings or only enabled ones
      - in: query
        name: filter_fields
        schema:
          type: string
        description: Comma separated list of fields to filter
      tags:
      - v0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAdvancedSettings'
          description: ''
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
    patch:
      operationId: v0_advanced_settings_partial_update
      description: |-
        Update a course's advanced settings.

        **Example Request**

            PATCH /api/contentstore/v0/advanced_settings/{course_id} {
                "{setting_name}": {
                    "value": {setting_value}
                }
            }

        **PATCH Parameters**

        The data sent for a patch request should follow a similar format as
        is returned by a ``GET`` request. Multiple settings can be updated in
        a single request, however only the ``value`` field can be updated
        any other fields, if included, will be ignored.

        Here is an example request that updates the ``advanced_modules``
        available for the course, and enables the calculator tool:

        ```json
        {
            "advanced_modules": {
                "value": [
                    "poll",
                    "survey",
                    "drag-and-drop-v2",
                    "lti_consumer"
                ]
            },
            "show_calculator": {
                "value": true
            }
        }
        ```

        **Response Values**

        If the request is successful, an HTTP 200 "OK" response is returned,
        along with all the course's settings similar to a ``GET`` request.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseAdvancedSettings'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCourseAdvancedSettings'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCourseAdvancedSettings'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseAdvancedSettings'
          description: ''
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v0/file_assets/{course_id}:
    get:
      operationId: v0_file_assets_retrieve
      description: |-
        public rest API endpoints for the CMS API Assets.
        course_key: required argument, needed to authorize course authors and identify the asset.
        asset_key_string: required argument, needed to identify the asset.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - v0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    post:
      operationId: v0_file_assets_create
      description: |-
        public rest API endpoints for the CMS API Assets.
        course_key: required argument, needed to authorize course authors and identify the asset.
        asset_key_string: required argument, needed to identify the asset.
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
          pattern: ^[^/+]+(/|\+)[^/+]+(/|\+)[^/?]+$
        required: true
      tags:
      - v0
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Asset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Asset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Asset'
          '*/*':
            schema:
              $ref: '#/components/schemas/Asset'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
