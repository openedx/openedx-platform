          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v3/course_details/{course_id}/:
    get:
      operationId: v3_course_details_retrieve
      description: Get an object containing the course details for the specified course.
        Supports the ADR 0036 ``?view=minimal`` preset and ``?fields=`` explicit field
        selection (see the parameter descriptions for details).
      summary: Retrieve a course's details
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      - in: query
        name: fields
        schema:
          type: string
        description: ADR 0036 explicit field selection. Comma-separated list of top-level
          keys to include in the response (e.g. ``course_id,title,start_date``). When
          combined with ``?view=``, the preset is applied first and ``?fields=`` is
          applied to the result. Unknown keys are silently skipped.
      - in: query
        name: view
        schema:
          type: string
          enum:
          - minimal
        description: ADR 0036 response preset. ``minimal`` drops heavy fields (overview,
          syllabus, description, instructor_info, learning_info, banner/video assets,
          license) leaving only identification, schedule, and flags. Omit the parameter
          to receive the full response.
      tags:
      - openedx-platform-sdk
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetails'
          description: Course details retrieved successfully. The schema below is
            the full default response; when ``?view=minimal`` and/or ``?fields=``
            is supplied, the response contains a subset of these top-level keys (see
            ADR 0036).
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
    put:
      operationId: v3_course_details_update
      description: Update the details for the specified course.
      summary: Update a course's details
      parameters:
      - in: path
        name: course_id
        schema:
          type: string
        description: Course ID
        required: true
      tags:
      - openedx-platform-sdk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseDetails'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CourseDetails'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourseDetails'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetails'
          description: Course details updated successfully.
        '400':
          description: Bad request — invalid data.
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester cannot access the specified course.
        '404':
          description: The requested course does not exist.
  /v3/home/:
    get:
      operationId: v3_home_retrieve
      description: |-
        Get an object containing all courses and libraries on home page.

        **Example Request**

            GET /api/contentstore/v3/home/
            GET /api/contentstore/v3/home/?fields=courses,libraries  (ADR 0036)
      parameters:
      - in: query
        name: fields
        schema:
          type: string
        description: ADR 0036 explicit field selection. Comma-separated list of top-level
          keys to include in the response (e.g. ``courses,libraries,studio_name``).
          Omit for the full response. Unknown keys are silently skipped.
      - in: query
        name: org
        schema:
          type: string
        description: Filter by course org
      tags:
      - openedx-platform-sdk
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioHome'
          description: ''
  /v3/home/courses/:
    get:
      operationId: v3_home_courses_retrieve
      description: |-
        Get an object containing all courses.

        **Example Request**

            GET /api/contentstore/v3/home/courses/
      parameters:
      - in: query
        name: org
        schema:
          type: string
        description: Query param to filter by course org
      tags:
      - openedx-platform-sdk
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseHomeTab'
          description: ''
        '401':
          description: The requester is not authenticated.
  /v3/home/libraries/:
    get:
      operationId: v3_home_libraries_retrieve
      description: |-
        Get an object containing all libraries on home page.

        **Example Request**

            GET /api/contentstore/v3/home/libraries/
      parameters:
      - in: query
        name: is_migrated
        schema:
          type: boolean
        description: Query param to filter by migrated status of library. If present
          (true or false), it will filter by migration status else it will return
          all legacy libraries.
      - in: query
        name: org
        schema:
          type: string
        description: Query param to filter by course org
      tags:
      - openedx-platform-sdk
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryTab'
          description: ''
        '401':
          description: The requester is not authenticated.
  /v4/home/courses/:
    get:
      operationId: v4_home_courses_retrieve
      description: Returns a paginated list of all courses available to the logged-in
        user, with optional filtering and ordering. Supersedes ``GET /api/contentstore/v2/home/courses``.
      summary: List courses for the Studio home page (paginated)
      parameters:
      - in: query
        name: active_only
        schema:
          type: string
        description: Filter to active courses only
      - in: query
        name: archived_only
        schema:
          type: string
        description: Filter to archived courses only
      - in: query
        name: order
        schema:
          type: string
        description: Deprecated alias for 'ordering' (ADR 0033). Use 'ordering' instead.
        deprecated: true
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Order by course field: display_name, org, number, or run (ADR
          0033 standard parameter).'
      - in: query
        name: org
        schema:
          type: string
        description: Filter by course org
      - in: query
        name: page
        schema:
          type: string
        description: Page number for pagination
      - in: query
        name: page_size
        schema:
          type: string
        description: Number of courses per page (default 10, max 100)
      - in: query
        name: search
        schema:
          type: string
        description: Filter by course name, org, or number
      tags:
      - openedx-platform-sdk
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedV4HomeCoursesResponse'
          description: Paginated course list retrieved successfully.
        '401':
          description: The requester is not authenticated.
  /api/courses/{course_key_string}/bulk_enable_disable_discussions:
