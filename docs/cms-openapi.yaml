    PatchedCourseAdvancedSettings:
      type: object
      description: Serializer for course advanced settings.
      properties:
        lti_passports:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Enter the passports for course LTI tools in the following
            format: "id:client_key:client_secret".'
        textbooks:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: List of Textbook objects with (title, url) for textbooks used
            in this course
        wiki_slug:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Slug that points to the wiki for this course
        cosmetic_display_price:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: The cost displayed to students for enrolling in the course.
            If a paid course registration price is set by an administrator in the
            database, that price will be displayed instead of this one.
        advertised_start:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the text that you want to use as the advertised starting
            time frame for the course, such as "Winter 2018". If you enter null for
            this value, the start date that you have set for this course is used.
        grading_policy:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Grading policy definition for this class
        show_calculator:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. When true, students can see the calculator
            in the course.
        display_name:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the name of the course as it should appear in the course
            list.
        course_edit_method:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the method by which this course is edited ("XML" or "Studio").
        end_of_course_survey_url:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the URL for the end-of-course survey. If your course
            does not have a survey, enter null.
        discussion_blackouts:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Enter pairs of dates between which students cannot post to
            discussion forums. Inside the provided brackets, enter an additional set
            of square brackets surrounding each pair of dates you add. Format each
            pair of dates as ["YYYY-MM-DD", "YYYY-MM-DD"]. To specify times as well
            as dates, format each pair as ["YYYY-MM-DDTHH:MM", "YYYY-MM-DDTHH:MM"].
            Be sure to include the "T" between the date and time. For example, an
            entry defining two blackout periods looks like this, including the outer
            pair of square brackets: [["2015-09-15", "2015-09-21"], ["2015-10-01",
            "2015-10-08"]] '
        discussion_topics:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Enter discussion categories in the following format: "CategoryName":
            {"id": "i4x-InstitutionName-CourseNumber-course-CourseRun"}. For example,
            one discussion category may be "Lydian Mode": {"id": "i4x-UniversityX-MUS101-course-2015_T1"}.
            The "id" value for each category must be unique. In "id" values, the only
            special characters that are supported are underscore, hyphen, and period.
            You can also specify a category as the default for new posts in the Discussion
            page by setting its "default" attribute to true. For example, "Lydian
            Mode": {"id": "i4x-UniversityX-MUS101-course-2015_T1", "default": true}.'
        announcement:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the date to announce your course.
        mobile_available:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, the course will be available
            to mobile devices.
        video_upload_pipeline:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the unique identifier for your course's video files provided
            by Your Platform Name Here.
        no_grade:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, the course will not be graded.
        disable_progress_graph:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, students cannot view the progress
            graph.
        html_textbooks:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: For HTML textbooks that appear as separate tabs in the course,
            enter the name of the tab (usually the title of the book) as well as the
            URLs and titles of each chapter in the book.
        remote_gradebook:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the remote gradebook mapping. Only use this setting when
            REMOTE_GRADEBOOK_URL has been specified.
        enable_ccx:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Allow course instructors to assign CCX Coach roles, and allow
            coaches to manage Custom Courses on Your Platform Name Here. When false,
            Custom Courses cannot be created, but existing Custom Courses will be
            preserved.
        ccx_connector:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: URL for CCX Connector application for managing creation of
            CCXs. (optional). Ignored unless 'Enable CCX' is set to 'true'.
        allow_anonymous:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, students can create discussion
            posts that are anonymous to all users.
        allow_anonymous_to_peers:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, students can create discussion
            posts that are anonymous to other students. This setting does not make
            posts anonymous to course staff.
        advanced_modules:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the names of the advanced modules to use in your course.
        due_date_display_format:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the format for due dates. The default is Mon DD, YYYY.
            Enter "%m-%d-%Y" for MM-DD-YYYY, "%d-%m-%Y" for DD-MM-YYYY, "%Y-%m-%d"
            for YYYY-MM-DD, or "%Y-%d-%m" for YYYY-DD-MM.
        enrollment_domain:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the external login method students can use for the course.
        certificates_show_before_end:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, students can download certificates
            before the course ends, if they've met certificate requirements.
        course_image:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Edit the name of the course image file. You must upload this
            file on the Files & Uploads page. You can also set the course image on
            the Settings & Details page.
        banner_image:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Edit the name of the banner image file. You can set the banner
            image on the Settings & Details page.
        video_thumbnail_image:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Edit the name of the video thumbnail image file. You can set
            the video thumbnail image on the Settings & Details page.
        cert_name_short:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Use this setting only when generating PDF certificates. Between
            quotation marks, enter the short name of the type of certificate that
            students receive when they complete the course. For instance, "Certificate".
        cert_name_long:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Use this setting only when generating PDF certificates. Between
            quotation marks, enter the long name of the type of certificate that students
            receive when they complete the course. For instance, "Certificate of Achievement".
        cert_html_view_enabled:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: If true, certificate Web/HTML views are enabled for the course.
        cert_html_view_overrides:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter course-specific overrides for the Web/HTML template parameters
            here (JSON format)
        css_class:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Allows courses to share the same css class across runs even
            if they have different numbers.
        discussion_link:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Allows specification of an external link to replace discussion
            forums.
        hide_progress_tab:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Allows hiding of the progress tab.
        display_organization:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the course organization that you want to appear in the
            course. This setting overrides the organization that you entered when
            you created the course. To use the organization that you entered when
            you created the course, enter null.
        display_coursenumber:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the course number that you want to appear in the course.
            This setting overrides the course number that you entered when you created
            the course. To use the course number that you entered when you created
            the course, enter null.
        max_student_enrollments_allowed:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the maximum number of students that can enroll in the
            course. To allow an unlimited number of students, enter null.
        allow_public_wiki_access:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, students can view the course
            wiki even if they're not enrolled in the course.
        invitation_only:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Whether to restrict enrollment to invitation by the course
            staff.
        course_survey_name:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Name of SurveyForm to display as a pre-course survey to the
            user.
        course_survey_required:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Specify whether students must complete a survey before they
            can view your course content. If you set this value to true, you must
            add a name for the survey to the Course Survey Name setting above.
        catalog_visibility:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Defines the access permissions for showing the course in the
            course catalog. This can be set to one of three values: ''both'' (show
            in catalog and allow access to about page), ''about'' (only allow access
            to about page), ''none'' (do not show in catalog and do not allow access
            to an about page).'
        social_sharing_url:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'If dashboard social sharing and custom course URLs are enabled,
            you can provide a URL (such as the URL to a course About page) that social
            media sites can link to. URLs must be fully qualified. For example: http://www.edx.org/course/Introduction-to-MOOCs-ITM001'
        teams_configuration:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Configure team sets, limit team sizes, and set visibility settings
            using JSON. See <a target="&#95;blank" href="https://docs.openedx.org/en/latest/educators/references/advanced_features/teams_configuration_options.html>teams
            configuration documentation</a> for help and examples.
        enable_proctored_exams:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If this value is true, proctored exams
            are enabled in your course. Note that enabling proctored exams will also
            enable timed exams.
        proctoring_provider:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Enter the proctoring provider you want to use for this course
            run. Choose from the following options: {available_providers}.'
        proctoring_escalation_email:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Required if 'requires_escalation_email' is set in the proctoring
            backend.Enter an email address to be contacted by the support team whenever
            there are escalations (e.g. appeals, delayed reviews, etc.).
        allow_proctoring_opt_out:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If this value is true, learners can choose
            to take proctored exams without proctoring. If this value is false, all
            learners must take the exam with proctoring. This setting only applies
            if proctored exams are enabled for the course.
        create_zendesk_tickets:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If this value is true, a Zendesk ticket
            will be created for suspicious attempts.
        enable_timed_exams:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If this value is true, timed exams are
            enabled in your course. Regardless of this setting, timed exams are enabled
            if Enable Proctored Exams is set to true.
        enable_subsection_gating:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If this value is true, you can hide a
            subsection until learners earn a minimum score in another, prerequisite
            subsection.
        learning_info:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Specify what student can learn from the course.
        course_visibility:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Defines the access permissions for unenrolled learners. This
            can be set to one of three values: ''private'' (default visibility, only
            allowed for enrolled students), ''public_outline'' (allow access to course
            outline) and ''public'' (allow access to both outline and course content).'
        video_sharing_options:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Specify the video sharing options for the course. This can
            be set to one of three values: ''all-on'', ''all-off'' and ''per-video''.
            with ''per-video'' as the default.'
        force_on_flexible_peer_openassessments:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Setting this flag will force on the flexible grading option
            for all peer-graded ORAs in this course.
        instructor_info:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the details for Course Instructor
        allow_unsupported_xblocks:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, you can add unsupported problems
            and tools to your course in Studio. Unsupported problems and tools are
            not recommended for use in courses due to non-compliance with one or more
            of the base requirements, such as testing, accessibility, internationalization,
            and documentation.
        course_wide_js:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter Javascript resource URLs you want to be loaded globally
            throughout the course pages.
        course_wide_css:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter CSS resource URLs you want to be loaded globally throughout
            the course pages.
        other_course_settings:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Any additional information about the course that the platform
            needs or that allows integration with external systems such as CRM software.
            Enter a dictionary of values in JSON format, such as { "my_custom_setting":
            "value", "other_setting": "value" }'
    PatchedXblock:
      type: object
      description: |-
        A serializer for xblocks that enforces strict validation.

        The serializer ensures:
        1. All top-level fields have the expected data types.
        2. No unexpected fields are passed in.

        Note: The current list of fields is not exhaustive. It is primarily designed
        to support the CMS API demo. While optional fields have been added, they were
        chosen based on ease of discovery, not comprehensiveness.
      properties:
        id:
          type: string
          nullable: true
        parent_locator:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        data:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: {}
          nullable: true
        has_changes:
          type: boolean
          nullable: true
        children:
          type: array
          items: {}
          nullable: true
        fields:
          type: object
          additionalProperties: {}
          nullable: true
        has_children:
          type: boolean
          nullable: true
        video_sharing_enabled:
          type: boolean
          nullable: true
        video_sharing_options:
          type: string
          nullable: true
        video_sharing_doc_url:
          type: string
          nullable: true
        edited_on:
          type: string
          nullable: true
        published:
          type: boolean
          nullable: true
        published_on:
          nullable: true
        studio_url:
          type: string
          nullable: true
        released_to_students:
          type: boolean
          nullable: true
        release_date:
          nullable: true
        nullout:
          nullable: true
        graderType:
          nullable: true
        visibility_state:
          type: string
          nullable: true
        has_explicit_staff_lock:
          type: boolean
          nullable: true
        start:
          type: string
          nullable: true
        graded:
          type: boolean
          nullable: true
        due_date:
          type: string
          nullable: true
        due:
          nullable: true
        relative_weeks_due:
          nullable: true
        format:
          nullable: true
        course_graders:
          type: array
          items: {}
          nullable: true
        actions:
          type: object
          additionalProperties: {}
          nullable: true
        explanatory_message:
          type: string
          nullable: true
        group_access:
          type: object
          additionalProperties: {}
          nullable: true
        user_partitions:
          type: array
          items: {}
          nullable: true
        show_correctness:
          type: string
          nullable: true
        discussion_enabled:
          type: boolean
          nullable: true
        ancestor_has_staff_lock:
          type: boolean
          nullable: true
        user_partition_info:
          type: object
          additionalProperties: {}
          nullable: true
        summary_configuration_enabled:
          nullable: true
        isPrereq:
          type: boolean
          nullable: true
        prereqUsageKey:
          type: string
          nullable: true
        prereqMinScore:
          type: integer
          nullable: true
        prereqMinCompletion:
          type: integer
          nullable: true
        publish:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PublishEnum'
          - $ref: '#/components/schemas/NullEnum'
        duplicate_source_locator:
          type: string
          nullable: true
        move_source_locator:
          type: string
          nullable: true
        target_index:
          type: integer
          nullable: true
        boilerplate:
          nullable: true
        staged_content:
          type: string
          nullable: true
        hide_from_toc:
          type: boolean
          nullable: true
    Patchedauthoring_grading.CourseGrading.v0:
      type: object
      description: Serializer for course grading model data
