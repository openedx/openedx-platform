        allow_public_wiki_access:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. If true, students can view the course
            wiki even if they're not enrolled in the course.
        invitation_only:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Whether to restrict enrollment to invitation by the course
