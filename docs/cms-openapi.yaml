    Xblock:
      type: object
      description: |-
        A serializer for xblocks that enforces strict validation.

        The serializer ensures:
        1. All top-level fields have the expected data types.
        2. No unexpected fields are passed in.

        Note: The current list of fields is not exhaustive. It is primarily designed
        to support the CMS API demo. While optional fields have been added, they were
        chosen based on ease of discovery, not comprehensiveness.
      properties:
        id:
          type: string
          nullable: true
        parent_locator:
          type: string
          nullable: true
        display_name:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        data:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: {}
          nullable: true
        has_changes:
          type: boolean
          nullable: true
        children:
          type: array
          items: {}
          nullable: true
        fields:
          type: object
          additionalProperties: {}
          nullable: true
        has_children:
          type: boolean
          nullable: true
        video_sharing_enabled:
          type: boolean
          nullable: true
        video_sharing_options:
          type: string
          nullable: true
        video_sharing_doc_url:
          type: string
          nullable: true
        edited_on:
          type: string
          nullable: true
        published:
          type: boolean
          nullable: true
        published_on:
          nullable: true
        studio_url:
          type: string
          nullable: true
        released_to_students:
          type: boolean
          nullable: true
        release_date:
          nullable: true
        nullout:
          nullable: true
        graderType:
          nullable: true
        visibility_state:
          type: string
          nullable: true
        has_explicit_staff_lock:
          type: boolean
          nullable: true
        start:
          type: string
          nullable: true
        graded:
          type: boolean
          nullable: true
        due_date:
          type: string
          nullable: true
        due:
          nullable: true
        relative_weeks_due:
          nullable: true
        format:
          nullable: true
        course_graders:
          type: array
          items: {}
          nullable: true
        actions:
          type: object
          additionalProperties: {}
          nullable: true
        explanatory_message:
          type: string
          nullable: true
        group_access:
          type: object
          additionalProperties: {}
          nullable: true
        user_partitions:
          type: array
          items: {}
          nullable: true
        show_correctness:
