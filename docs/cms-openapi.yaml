        description: Usage key identifying the xblock (e.g. ``block-v1:edX+DemoX+Demo_Course+type@vertical+block@abcd``).
          Also accepts legacy ``i4x://`` locators.
        required: true
      tags:
      - openedx-platform-sdk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Xblock'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Xblock'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Xblock'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Xblock'
          description: The xblock was updated successfully.
        '400':
          description: Request body failed validation.
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester does not have permission for this xblock's course.
        '404':
          description: The requested xblock does not exist.
        '406':
          description: Requested representation is not available (e.g. non-JSON ``Accept``).
