        '403':
          description: Permission denied
components:
  schemas:
    ActionEnum:
      enum:
      - all
      - single
      type: string
      description: |-
        * `all` - all
        * `single` - single
    AdvancedSettingsField:
      type: object
      description: |-
        Serializer for a single course setting field.

        This serializer accepts a ``value_field`` parameter that allows you to
        specify what field to use for a particular instance of this serializer.

        Args:
            value_field (SerializerField): The ``value`` field will have this type
      properties:
        deprecated:
          type: boolean
          readOnly: true
          description: Marks a field as deprecated.
        display_name:
          type: string
          readOnly: true
          description: User-friendly display name for the field
        help:
          type: string
          readOnly: true
          description: Help text that describes the setting.
        value:
          type: array
          items: {}
      required:
      - deprecated
      - display_name
      - help
      - value
    AncestorXBlock:
      type: object
      description: Serializer for representing the ancestor XBlock and its children.
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildAncestor'
        title:
          type: string
        is_last:
          type: boolean
      required:
      - children
      - is_last
      - title
    Asset:
      type: object
      description: Strict Serializer for file assets.
      properties:
        file:
          type: string
          format: uri
          nullable: true
        locked:
          type: boolean
          nullable: true
    CertificateItem:
      type: object
      description: Serializer for representing certificate item created for current
        course.
      properties:
        course_title:
          type: string
        description:
          type: string
        editing:
          type: boolean
        id:
          type: integer
        is_active:
          type: boolean
        name:
          type: string
        signatories:
          type: array
          items:
            $ref: '#/components/schemas/CertificateSignatory'
        version:
          type: integer
      required:
      - description
      - id
      - is_active
      - name
      - signatories
      - version
    CertificateSignatory:
      type: object
      description: Serializer for representing certificate's signatory.
      properties:
        id:
          type: integer
        name:
          type: string
        organization:
          type: string
        signature_image_path:
          type: string
        title:
          type: string
      required:
      - id
      - name
      - signature_image_path
      - title
    ChildAncestor:
      type: object
      description: Serializer for representing child blocks in the ancestor XBlock.
      properties:
        url:
          type: string
          readOnly: true
        display_name:
          type: string
        usage_key:
          type: string
      required:
      - display_name
      - url
      - usage_key
    ContainerChild:
      type: object
      description: Serializer for representing a xblock child of vertical container.
      properties:
        name:
          type: string
        block_id:
          type: string
        block_type:
          type: string
        user_partition_info:
          type: object
          additionalProperties: {}
        user_partitions:
          type: array
          items: {}
        upstream_link:
          allOf:
          - $ref: '#/components/schemas/UpstreamLink'
          nullable: true
        actions:
          type: string
          readOnly: true
        validation_messages:
          type: array
          items:
            $ref: '#/components/schemas/MessageValidation'
        render_error:
          type: string
      required:
      - actions
      - block_id
      - block_type
      - name
      - render_error
      - upstream_link
      - user_partition_info
      - user_partitions
      - validation_messages
    ContainerChildren:
      type: object
      description: Serializer for representing a vertical container with state and
        children.
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ContainerChild'
        is_published:
          type: boolean
        can_paste_component:
          type: boolean
        display_name:
          type: string
        upstream_ready_to_sync_children_info:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamReadyToSyncChildrenInfo'
          description: List of dictionaries describing upstream child components readiness
            to sync.
      required:
      - can_paste_component
      - children
      - display_name
      - is_published
    ContainerHandler:
      type: object
      description: Serializer for container handler
      properties:
        language_code:
          type: string
        action:
          type: string
        xblock:
          $ref: '#/components/schemas/ContainerXBlock'
        is_unit_page:
          type: boolean
        is_collapsible:
          type: boolean
        position:
          type: integer
          minimum: 1
        prev_url:
          type: string
          nullable: true
        next_url:
          type: string
          nullable: true
        new_unit_category:
          type: string
        outline_url:
          type: string
        ancestor_xblocks:
          type: array
          items:
            $ref: '#/components/schemas/AncestorXBlock'
        component_templates:
          type: array
          items:
            type: object
            additionalProperties: {}
        xblock_info:
          type: object
          additionalProperties: {}
        draft_preview_link:
          type: string
        published_preview_link:
          type: string
        show_unit_tags:
          type: boolean
        user_clipboard:
          type: object
          additionalProperties: {}
        is_fullwidth_content:
          type: boolean
        assets_url:
          type: string
          readOnly: true
        unit_block_id:
          type: string
        subsection_location:
          type: string
        course_sequence_ids:
          type: array
          items:
            type: string
        library_content_picker_url:
          type: string
      required:
      - action
      - ancestor_xblocks
      - assets_url
      - component_templates
      - course_sequence_ids
      - draft_preview_link
      - is_collapsible
      - is_fullwidth_content
      - is_unit_page
      - language_code
      - library_content_picker_url
      - new_unit_category
      - next_url
      - outline_url
      - position
      - prev_url
      - published_preview_link
      - show_unit_tags
      - subsection_location
      - unit_block_id
      - user_clipboard
      - xblock
      - xblock_info
    ContainerXBlock:
      type: object
      description: Serializer for representing XBlock data. Doesn't include all data
        about XBlock.
      properties:
        display_name:
          type: string
        display_type:
          type: string
          readOnly: true
        category:
          type: string
      required:
      - category
      - display_name
      - display_type
    ContentTypeEnum:
      enum:
      - video/mp4
      - video/webm
      - video/ogg
      type: string
      description: |-
        * `video/mp4` - video/mp4
        * `video/webm` - video/webm
        * `video/ogg` - video/ogg
    CourseAdvancedSettings:
      type: object
      description: Serializer for course advanced settings.
      properties:
        lti_passports:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Enter the passports for course LTI tools in the following
            format: "id:client_key:client_secret".'
        textbooks:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: List of Textbook objects with (title, url) for textbooks used
            in this course
        wiki_slug:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Slug that points to the wiki for this course
        cosmetic_display_price:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: The cost displayed to students for enrolling in the course.
            If a paid course registration price is set by an administrator in the
            database, that price will be displayed instead of this one.
        advertised_start:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the text that you want to use as the advertised starting
            time frame for the course, such as "Winter 2018". If you enter null for
            this value, the start date that you have set for this course is used.
        grading_policy:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Grading policy definition for this class
        show_calculator:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter true or false. When true, students can see the calculator
            in the course.
        display_name:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the name of the course as it should appear in the course
            list.
        course_edit_method:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the method by which this course is edited ("XML" or "Studio").
        end_of_course_survey_url:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the URL for the end-of-course survey. If your course
            does not have a survey, enter null.
        discussion_blackouts:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Enter pairs of dates between which students cannot post to
            discussion forums. Inside the provided brackets, enter an additional set
            of square brackets surrounding each pair of dates you add. Format each
            pair of dates as ["YYYY-MM-DD", "YYYY-MM-DD"]. To specify times as well
            as dates, format each pair as ["YYYY-MM-DDTHH:MM", "YYYY-MM-DDTHH:MM"].
            Be sure to include the "T" between the date and time. For example, an
            entry defining two blackout periods looks like this, including the outer
            pair of square brackets: [["2015-09-15", "2015-09-21"], ["2015-10-01",
            "2015-10-08"]] '
        discussion_topics:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: 'Enter discussion categories in the following format: "CategoryName":
            {"id": "i4x-InstitutionName-CourseNumber-course-CourseRun"}. For example,
            one discussion category may be "Lydian Mode": {"id": "i4x-UniversityX-MUS101-course-2015_T1"}.
            The "id" value for each category must be unique. In "id" values, the only
            special characters that are supported are underscore, hyphen, and period.
            You can also specify a category as the default for new posts in the Discussion
            page by setting its "default" attribute to true. For example, "Lydian
            Mode": {"id": "i4x-UniversityX-MUS101-course-2015_T1", "default": true}.'
        announcement:
          allOf:
          - $ref: '#/components/schemas/AdvancedSettingsField'
          description: Enter the date to announce your course.
        mobile_available:
