  /v1/xblock/{usage_key_string}/:
    get:
      operationId: v1_xblock_retrieve
      description: Retrieve an xblock (and, by default, its nested tree) by usage
        key. Supports ADR 0036 ``?view=minimal`` to strip contextual fields, plus
        the legacy ``?fields=`` type-of-response selector.
      summary: Retrieve an xblock
      parameters:
      - in: query
        name: fields
        schema:
          type: string
        description: |-
          **Legacy pass-through** (v0/v1 semantics). Selects a *type* of response rather than a subset of top-level keys:
            * ``fields=graderType`` — return the grader-type value directly
            * ``fields=ancestorInfo`` — return concise ancestor info
            * ``fields=customReadToken`` — include parent + children on the response
          Note: this is **not** the ADR 0036 ``?fields=`` CSV subset convention. New callers should use ``?view=minimal`` instead.
        deprecated: true
      - in: path
        name: usage_key_string
        schema:
          type: string
        description: Usage key identifying the xblock (e.g. ``block-v1:edX+DemoX+Demo_Course+type@vertical+block@abcd``).
          Also accepts legacy ``i4x://`` locators.
        required: true
      - in: query
        name: view
        schema:
          type: string
          enum:
          - minimal
        description: ADR 0036 response preset. ``minimal`` drops heavy/contextual
          xblock fields (``data``, ``metadata``, ``fields``, ``student_view_data``,
          ``edited_on``, ``published`` …) and keeps only the structural fields (``id``,
          ``display_name``, ``category``, ``children``, ``has_children``, ``studio_url``).
          Omit the parameter to receive the full xblock response.
      tags:
      - openedx-platform-sdk
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Xblock'
          description: The xblock representation.
        '401':
          description: The requester is not authenticated.
        '403':
          description: The requester does not have permission for this xblock's course.
        '404':
          description: The requested xblock does not exist.
        '406':
          description: Requested representation is not available (e.g. non-JSON ``Accept``).
    put:
